name: team-peppy
services:
  app:
    image: team-peppy:${TEAM_PEPPY_VERSION:-huly-v1}
    build:
      context: ./release
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    env_file: ./config/runtime.env
    ports:
      - "127.0.0.1:3083:13082"
    volumes:
      - ./runtime:/home/node/.dsh
      - ./workspace:/workspace
      - ./config/huly-token:/run/secrets/huly-token:ro
    networks:
      - huly
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, -H, "x-orchestrator-request: 1", "http://127.0.0.1:3082/orchestrator/api/state"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 4
networks:
  huly:
    external: true
    name: huly_huly_net
